name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: paris-test
          MYSQL_DATABASE: paris_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pparis-test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PARIS_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=paris_test
      PARIS_TEST_MYSQL_USER: root
      PARIS_TEST_MYSQL_PASSWORD: paris-test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
